name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      engine-ref:
        description: Branch, tag, or commit of the Runrail engine the sidecar is built from
        default: main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Check the tag matches the app version and the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          UPDATER_PUBKEY: ${{ vars.RUNRAIL_UPDATER_PUBKEY }}
        run: |
          if [ -z "$UPDATER_PUBKEY" ]; then
            echo "::error::a release needs the RUNRAIL_UPDATER_PUBKEY variable and the updater secrets (docs/RELEASE.md), or its installs never update"
            exit 1
          fi
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          for found in "$(bun -p "require('./package.json').version")" "$(bun -p "require('./src-tauri/tauri.conf.json').version")" "$cargo"; do
            if [ "v$found" != "$TAG" ]; then
              echo "::error::tag $TAG does not match version $found in package.json, tauri.conf.json, and Cargo.toml"
              exit 1
            fi
          done
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # Builds never get the updater key or the Apple credentials: Vite plugins, Cargo build scripts, and
  # the engine checkout all run here. On a version tag the sign job signs what they upload.
  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            artifact: macos-arm64
            rust-tests: true
          - name: macOS x64
            os: macos-15-intel
            artifact: macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            arch: x86_64
            bundles: deb,rpm
            artifact: linux-x64
          - name: Linux arm64
            os: ubuntu-22.04-arm
            arch: aarch64
            bundles: deb,rpm
            artifact: linux-arm64
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The updater is compiled in when the repository has its public key (docs/RELEASE.md), never on
      # pull requests. Clients read the feed from the latest published release.
      RUNRAIL_UPDATER_PUBKEY: ${{ github.event_name != 'pull_request' && vars.RUNRAIL_UPDATER_PUBKEY || '' }}
      RUNRAIL_UPDATE_URL: ${{ vars.RUNRAIL_UPDATE_URL || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
    steps:
      # Side by side, so the sidecar script finds the engine at ../runrail.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: runrail-desktop

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: TechDev009/runrail
          # A tag builds against the engine's tag of the same name.
          ref: ${{ inputs.engine-ref || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'main' }}
          path: runrail

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # Pinned by commit, so the toolchain is named here rather than by the ref.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runrail-desktop/src-tauri -> target

      # Glibc 2.35 (Ubuntu 22.04) is the oldest the Linux builds support (docs/LINUX.md).
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev cmake file pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libasound2-dev patchelf

      - name: Install dependencies
        run: |
          (cd runrail && bun install --frozen-lockfile)
          (cd runrail-desktop && bun install --frozen-lockfile)

      - name: Build the engine sidecar
        working-directory: runrail-desktop
        run: bun scripts/sidecar.ts

      - name: Rust tests
        if: matrix.rust-tests
        working-directory: runrail-desktop/src-tauri
        run: cargo test --lib

      # The public key is compiled in here, but with createUpdaterArtifacts on, tauri build would sign
      # the bundles and so need the private key. The sign job signs them instead.
      - name: Write the updater config
        if: env.RUNRAIL_UPDATER_PUBKEY != ''
        working-directory: runrail-desktop
        run: |
          bun scripts/release.ts config
          printf '{"bundle":{"createUpdaterArtifacts":false}}\n' > src-tauri/tauri.unsigned.conf.json

      - name: Build the app
        if: runner.os != 'macOS'
        working-directory: runrail-desktop
        run: |
          updater=()
          [ -n "$RUNRAIL_UPDATER_PUBKEY" ] && updater=(--features updater --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.unsigned.conf.json)
          bun run tauri build --bundles ${{ matrix.bundles }} "${updater[@]}"

      # Unsigned: the sign job signs and notarizes it and makes the DMG. A tarball keeps the bundle's
      # symlinks and executable bits, which upload-artifact drops.
      - name: Build the macOS app
        if: runner.os == 'macOS'
        working-directory: runrail-desktop
        run: |
          updater=()
          [ -n "$RUNRAIL_UPDATER_PUBKEY" ] && updater=(--features updater --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.unsigned.conf.json)
          bun run tauri build --bundles app "${updater[@]}"
          product="$(bun -p "require('./src-tauri/tauri.conf.json').productName")"
          version="$(bun -p "require('./src-tauri/tauri.conf.json').version")"
          arch="$([ "$(uname -m)" = arm64 ] && echo aarch64 || echo x64)"
          macos=src-tauri/target/release/bundle/macos
          "$macos/$product.app/Contents/MacOS/runrail" --version
          rm -f "$macos"/*.app.tar
          COPYFILE_DISABLE=1 tar -cf "$macos/${product}_${version}_${arch}.app.tar" -C "$macos" "$product.app"

      # linuxdeploy sets a RUNPATH on every program in usr/bin, which corrupts the Bun-compiled
      # engine, so the AppImage carries it in usr/libexec instead (engine.rs looks there).
      - name: Build the AppImage
        if: runner.os == 'Linux'
        working-directory: runrail-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          printf '{"bundle":{"externalBin":[],"linux":{"appimage":{"files":{"/usr/libexec/runrail/runrail":"binaries/runrail-%s-unknown-linux-gnu"}}}}}' "${{ matrix.arch }}" > "$RUNNER_TEMP/appimage.json"
          updater=()
          [ -n "$RUNRAIL_UPDATER_PUBKEY" ] && updater=(--features updater --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.unsigned.conf.json)
          bun run tauri build --bundles appimage "${updater[@]}" --config "$RUNNER_TEMP/appimage.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runrail-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            runrail-desktop/src-tauri/target/release/bundle/deb/*.deb
            runrail-desktop/src-tauri/target/release/bundle/rpm/*.rpm
            runrail-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            runrail-desktop/src-tauri/target/release/bundle/nsis/*.exe
            runrail-desktop/src-tauri/target/release/bundle/msi/*.msi
            runrail-desktop/src-tauri/target/release/bundle/macos/*.app.tar

  # The only job that sees the updater key and the Apple credentials. It runs no project code, only
  # codesign, notarytool, hdiutil, and the Tauri CLI on the downloaded builds. Its secrets live in the
  # release environment, which can require a reviewer's approval and allow only v* tags.
  sign:
    name: Sign
    needs: build
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: release
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      UPDATER: ${{ vars.RUNRAIL_UPDATER_PUBKEY != '' }}
    steps:
      # Entitlements come from the tag, not the build, so a build cannot sign itself more of them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: runrail-desktop
          persist-credentials: false
          sparse-checkout: |
            bun.lock
            src-tauri/tauri.conf.json
            src-tauri/Entitlements.plist
            src-tauri/Engine.entitlements.plist
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runrail-desktop-*
          path: artifacts

      # Only the CLI is installed, without install scripts, and only if npm served the files bun.lock pins.
      - name: Install the Tauri CLI
        if: env.UPDATER == 'true'
        run: |
          cli="$(grep -o '"@tauri-apps/cli@[0-9][^"]*"' runrail-desktop/bun.lock | head -n 1 | tr -d '"')"
          mkdir -p "$RUNNER_TEMP/tauri-cli"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/tauri-cli" "$cli"
          for integrity in $(jq -r '.packages | to_entries[] | select(.key != "") | .value.integrity' "$RUNNER_TEMP/tauri-cli/package-lock.json"); do
            if ! grep -qF "\"$integrity\"" runrail-desktop/bun.lock; then
              echo "::error::npm served a $cli that bun.lock does not pin ($integrity)."
              exit 1
            fi
          done
          echo "TAURI=$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" >> "$GITHUB_ENV"

      # A Developer ID signature needs the APPLE_* secrets (docs/RELEASE.md). Without them the apps
      # are signed ad hoc and not notarized.
      - name: Import the Developer ID certificate
        id: certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Developer ID certificate is configured; the app is signed ad hoc."
            exit 0
          fi
          if [ -z "$APPLE_API_PRIVATE_KEY" ]; then
            echo "::error::APPLE_CERTIFICATE is set without APPLE_API_PRIVATE_KEY, and a Developer ID build is notarized."
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          read -r -a searched <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${searched[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # The steps of scripts/release.ts mac after its build: the engine and the app each signed with
      # their own entitlements, checked, notarized and stapled, then the DMG and the update archive.
      # Ad hoc gives the engine alone JIT, but only a Developer ID and notarization get a downloaded
      # copy past Gatekeeper.
      - name: Sign the macOS apps
        env:
          IDENTITY: ${{ steps.certificate.outputs.identity || '-' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          config=runrail-desktop/src-tauri
          product="$(jq -r .productName "$config/tauri.conf.json")"
          identifier="$(jq -r .identifier "$config/tauri.conf.json")"
          sign=(codesign --force --options runtime --sign "$IDENTITY")
          notary=()
          if [ "$IDENTITY" != "-" ]; then
            if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ]; then
              echo "::error::a Developer ID build is notarized: set APPLE_API_KEY and APPLE_API_ISSUER."
              exit 1
            fi
            sign+=(--timestamp)
            notary=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          fi
          granted() { plutil -convert json -o - - | jq -r 'to_entries | map(select(.value == true) | .key) | sort | join(", ")'; }
          check() {
            local signed expected
            signed="$(codesign -d --entitlements - --xml "$1" 2>/dev/null | granted)"
            expected="$(granted < "$2")"
            if [ "$signed" != "$expected" ]; then
              echo "::error::$(basename "$1") is signed with [$signed], expected [$expected]"
              exit 1
            fi
            if ! codesign -dv "$1" 2>&1 | grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime'; then
              echo "::error::$(basename "$1") is not signed with the hardened runtime"
              exit 1
            fi
          }
          notarize() {
            local answer status
            answer="$(xcrun notarytool submit "$1" "${notary[@]}" --wait --output-format json)"
            status="$(jq -r '.status // "without a status"' <<< "$answer")"
            if [ "$status" != Accepted ]; then
              echo "::error::notarizing $(basename "$1") ended $status; see xcrun notarytool log $(jq -r '.id // "<id>"' <<< "$answer")"
              exit 1
            fi
          }
          mkdir -p signed
          for tarball in artifacts/runrail-desktop-macos-*/*.app.tar; do
            name="$(basename "$tarball" .app.tar)"
            work="$RUNNER_TEMP/$name"
            app="$work/$product.app"
            mkdir -p "$work/dmg"
            tar -xf "$tarball" -C "$work"
            xattr -cr "$app"
            main="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
            engine="$app/Contents/MacOS/runrail"
            while IFS= read -r -d '' file; do
              case "$file" in "$main" | "$engine") continue ;; esac
              case "$(file -b "$file")" in
                Mach-O*)
                  echo "::error::the signing plan does not cover $file"
                  exit 1
                  ;;
              esac
            done < <(find "$app" -type f -print0)
            "${sign[@]}" --identifier "$identifier.engine" --entitlements "$config/Engine.entitlements.plist" "$engine"
            "${sign[@]}" --entitlements "$config/Entitlements.plist" "$app"
            codesign --verify --strict --deep --verbose=2 "$app"
            check "$engine" "$config/Engine.entitlements.plist"
            check "$main" "$config/Entitlements.plist"
            if [ "$IDENTITY" != "-" ]; then
              ditto -c -k --keepParent "$app" "$work/$product.zip"
              notarize "$work/$product.zip"
              xcrun stapler staple "$app"
              spctl --assess --type execute --verbose=2 "$app"
            fi

            dmg="signed/$name.dmg"
            ditto "$app" "$work/dmg/$product.app"
            ln -s /Applications "$work/dmg/Applications"
            # hdiutil now and then fails with "Resource busy" on CI runners; a retry gets past it.
            for attempt in 1 2 3; do
              hdiutil create -volname "$product" -srcfolder "$work/dmg" -ov -format UDZO "$dmg" && break
              [ "$attempt" = 3 ] && exit 1
              sleep 5
            done
            if [ "$IDENTITY" != "-" ]; then
              codesign --force --timestamp --sign "$IDENTITY" "$dmg"
              notarize "$dmg"
              xcrun stapler staple "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            fi
            if [ "$UPDATER" = true ]; then
              # COPYFILE_DISABLE keeps macOS tar from adding ._ files, which would break the sealed signature.
              COPYFILE_DISABLE=1 tar -czf "signed/$name.app.tar.gz" -C "$work" "$product.app"
            fi
          done

      - name: Remove the signing keychain
        if: always() && steps.certificate.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Each signature is bound to the version, as tauri build binds it (requireSignedVersion).
      - name: Sign the updates
        if: env.UPDATER == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::RUNRAIL_UPDATER_PUBKEY is set without the TAURI_SIGNING_PRIVATE_KEY secret that signs the updates."
            exit 1
          fi
          for file in signed/*.app.tar.gz; do
            "$TAURI" signer sign --app-version "${TAG#v}" "$file"
          done
          for file in artifacts/runrail-desktop-*/*; do
            case "$file" in
              *.AppImage | *.deb | *.rpm | *.exe | *.msi)
                "$TAURI" signer sign --app-version "${TAG#v}" "$file"
                mv "$file.sig" signed/
                ;;
            esac
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runrail-desktop-signed
          if-no-files-found: error
          retention-days: 14
          path: signed/

  # A version tag (v0.1.0) collects every build into a draft GitHub release: nobody sees it until a
  # maintainer reviews the notes and files and clicks Publish. A failed build leaves no draft.
  release:
    name: Draft release
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: runrail-desktop
          sparse-checkout: |
            scripts/release.ts
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runrail-desktop-*
          path: artifacts

      # The update feed carries each bundle's signature, so the .sig files themselves are not
      # attached. Installed apps read latest.json from the latest published release only.
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          UPDATER: ${{ vars.RUNRAIL_UPDATER_PUBKEY != '' }}
        run: |
          duplicates="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "::error::two builds made files with the same name: $duplicates"
            exit 1
          fi
          mkdir bundles
          find artifacts -type f -exec mv -t bundles {} +
          # The sign job's DMGs and update archives stand in for the unsigned macOS apps.
          rm -f bundles/*.app.tar
          if [ "$UPDATER" = true ]; then
            bun runrail-desktop/scripts/release.ts feed --dir bundles --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          fi
          rm -f bundles/*.sig
          (cd bundles && sha256sum -- * > SHA256SUMS.txt)
          mapfile -t files < <(find bundles -type f | sort)
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published; its files are not replaced."
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "[" v "]") == 4; next } p' runrail-desktop/CHANGELOG.md > notes.md
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
              --title "Runrail Desktop ${TAG#v}" --notes-file notes.md
          fi
