name: GitHub relay

on:
  pull_request:
    paths:
      - services/github-relay/**
      - .github/workflows/github-relay.yml
  push:
    branches: [main]
    paths:
      - services/github-relay/**
      - .github/workflows/github-relay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Relay tests and dry run
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun test services/github-relay/test/relay.test.ts
      - run: bunx --bun wrangler@4.65.0 deploy --dry-run --config services/github-relay/wrangler.toml

  deploy:
    name: Deploy production relay
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-22.04
    environment: github-relay
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_SLUG: ${{ secrets.GITHUB_APP_SLUG }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Validate deployment credentials
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN GITHUB_APP_ID GITHUB_APP_SLUG GITHUB_APP_PRIVATE_KEY WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::The github-relay environment is missing $name"
              exit 1
            fi
          done
      - name: Provision Worker secrets without logging values
        working-directory: services/github-relay
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/github-relay-secrets.json"
          umask 077
          trap 'rm -f "$secret_file"' EXIT
          node -e 'process.stdout.write(JSON.stringify({GITHUB_APP_ID:process.env.GITHUB_APP_ID,GITHUB_APP_SLUG:process.env.GITHUB_APP_SLUG,GITHUB_APP_PRIVATE_KEY:process.env.GITHUB_APP_PRIVATE_KEY,WEBHOOK_SECRET:process.env.WEBHOOK_SECRET}))' > "$secret_file"
          bunx --bun wrangler@4.65.0 secret bulk "$secret_file" --config wrangler.toml
      - name: Deploy Worker and Durable Object migration
        working-directory: services/github-relay
        run: bunx --bun wrangler@4.65.0 deploy --config wrangler.toml
